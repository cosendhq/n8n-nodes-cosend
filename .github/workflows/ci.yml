name: ci

# Lint, typecheck, test and build every pull request and every push to main, on a GitHub-hosted
# runner. Read-only: this workflow never publishes. n8n-publish.yml is the only publisher.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The same action majors as n8n-publish.yml.
      - uses: actions/checkout@v5

      # The version comes from package.json's `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
